name: Contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#1a5cff&color_dots=#ebedf0,#b9d4ff,#7aa8ff,#3d7bff,#1a5cff
            dist/snake-dark.svg?palette=github-dark&color_snake=#19c8ff&color_dots=#161b22,#0d3a6b,#11589e,#1a7fd6,#19c8ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
